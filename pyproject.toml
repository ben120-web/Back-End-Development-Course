[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-bounded-coding-agent"
version = "1.0.0"
description = "Tool-using coding agent with workspace-bounded filesystem access"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Russell" }]
dependencies = ["google-genai>=1.12,<3", "python-dotenv>=1.1,<2"]

[project.scripts]
workspace-agent = "main:main"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["functions*"]

[tool.setuptools]
py-modules = ["config", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
